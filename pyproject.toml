[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ar-llm-eval"
version = "0.1.0"
description = "Open Arabic + Gulf dialect LLM benchmark: hand-written seed tasks (tashkeel, Emirati dialect, morphology, UAE context), deterministic graders, HTML leaderboard."
readme = "README.en.md"
license = {text = "MIT"}
authors = [{name = "Mohammad Hadi Javidi"}]
requires-python = ">=3.10"
keywords = ["arabic", "llm", "evaluation", "benchmark", "gulf-dialect", "emirati", "diacritization", "nlp", "leaderboard"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Arabic",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["httpx>=0.25", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mohammadhadijavidi/ar-llm-eval"
Issues = "https://github.com/mohammadhadijavidi/ar-llm-eval/issues"

[project.scripts]
ar-llm-eval = "ar_llm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ar_llm_eval = ["tasks/*.yaml", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
