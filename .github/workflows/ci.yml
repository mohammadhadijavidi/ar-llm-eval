name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate seed tasks (every reference must score 100)
        run: ar-llm-eval validate
      - name: Tests
        run: pytest -q
      - name: Offline demo leaderboard
        run: ar-llm-eval demo --out /tmp/demo
